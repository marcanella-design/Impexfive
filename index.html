<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impex Five - NF</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'</script></head><body class="bg-[#f4f6ff] min-h-screen"><header class="bg-white p-4 border-b flex gap-4 items-center"><div class="w-12 h-12 bg-[#0027b3] rounded-full flex items-center justify-center text-white font-bold">IF</div><div><h1 class="text-2xl font-extrabold text-[#0027b3]">IMPEX FIVE</h1><p class="text-xs tracking-widest text-[#0027b3]">IMPORTADORA</p></div></header><main class="max-w-5xl mx-auto p-6 space-y-4"><div class="bg-white p-4 rounded-xl flex gap-4"><div>Data Entrada: <input id="dataEntrada" type="date" class="border rounded px-2 py-1"></div><div class="ml-auto">Total: <span id="total" class="font-bold">R$ 0</span> | <span id="count">0 itens</span></div></div><div class="grid md:grid-cols-2 gap-4"><label class="bg-white border-2 border-dashed border-blue-300 rounded-xl p-8 text-center cursor-pointer">📤 <b>XML NF-e</b><br><span class="text-xs">Arraste aqui</span><input id="xmlInput" type="file" accept=".xml" multiple hidden></label><label class="bg-white border-2 border-dashed border-orange-300 rounded-xl p-8 text-center cursor-pointer">📄 <b>PDF DANFE</b><br><span class="text-xs">Leitura auto</span><input id="pdfInput" type="file" accept=".pdf" multiple hidden></label></div><div class="bg-white rounded-xl overflow-hidden"><table class="w-full text-sm"><thead class="bg-[#0027b3] text-white"><tr><th class="p-2 text-left">NF</th><th class="p-2 text-left">Descrição</th><th class="p-2">Qtd</th><th class="p-2">Total</th></tr></thead><tbody id="tbody"></tbody></table><div class="p-3 bg-gray-50 flex justify-end gap-2"><button onclick="produtos=[];render()" class="border px-3 py-1 rounded">Limpar</button><button id="btnExcel" class="bg-[#0027b3] text-white px-5 py-2 rounded font-bold">Gerar Excel Impex Five</button></div></div></main><script>
const d=document.getElementById('dataEntrada');d.valueAsDate=new Date();let produtos=[];let nfs=[];
function parseXML(t,f){try{const x=new DOMParser().parseFromString(t,'text/xml');const nf=x.querySelector('nNF')?.textContent||f;const emit=x.querySelector('emit > xNome')?.textContent||'';x.querySelectorAll('det').forEach(det=>{const p=det.querySelector('prod');if(!p)return;produtos.push({nf,emit,cProd:p.querySelector('cProd')?.textContent||'',xProd:p.querySelector('xProd')?.textContent||'',q:parseFloat(p.querySelector('qCom')?.textContent||0),v:parseFloat(p.querySelector('vProd')?.textContent||0),orig:'XML'})});render()}catch(e){alert('Erro XML')}}
async function parsePDF(file){const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let txt='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();txt+=c.items.map(it=>it.str).join(' ')}const m=txt.match(/N[º°]?\s*([0-9]{4,9})/);const nf=m?m[1]:file.name;const vt=txt.match(/Valor Total[^\d]*([0-9.,]+)/i);const v=vt?parseFloat(vt[1].replace(/\./g,'').replace(',','.')):0;produtos.push({nf,emit:'PDF',cProd:'PDF',xProd:'Produto DANFE '+nf+' - EDITE',q:1,v:v||0,orig:'PDF'});render()}
function render(){const tb=document.getElementById('tbody');tb.innerHTML='';let tot=0;produtos.forEach(p=>{tot+=p.v;tb.innerHTML+=`<tr class='border-b'><td class='p-2'>${p.nf}</td><td class='p-2'>${p.xProd}</td><td class='p-2 text-center'>${p.q}</td><td class='p-2 font-bold'>R$ ${p.v.toFixed(2)}</td></tr>`});document.getElementById('total').innerText='R$ '+tot.toLocaleString('pt-BR',{minimumFractionDigits:2});document.getElementById('count').innerText=produtos.length+' itens'}
document.getElementById('xmlInput').addEventListener('change',e=>{[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=ev=>parseXML(ev.target.result,f.name);r.readAsText(f)})});
document.getElementById('pdfInput').addEventListener('change',e=>{[...e.target.files].forEach(f=>parsePDF(f))});
document.getElementById('btnExcel').addEventListener('click',()=>{if(!produtos.length)return alert('Carregue NF');const ws=[['IMPEX FIVE IMPORTADORA'],['Data Entrada: '+d.value],['Gerado: '+new Date().toLocaleString('pt-BR')],[],['NF','Codigo','Descricao','Qtd','V.Total','Emitente','Origem']];produtos.forEach(p=>ws.push([p.nf,p.cProd,p.xProd,p.q,p.v,p.emit,p.orig]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ws),'Estoque');XLSX.writeFile(wb,'ImpexFive_'+d.value+'.xlsx')});
</script></body></html>
